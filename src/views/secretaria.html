<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - Secretaría</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container" style="max-width: 800px;">
        <div class="header" style="background-color: #546e7a;">
            <h2>Panel de Secretaría</h2>
            <a href="../index.html" style="color:white;">Volver al Inicio</a>
        </div>
        
        <div class="card">
            <h3>Métricas Generales (Acumulado)</h3>
            <p><strong>Total Ventas Confirmadas: </strong><span id="kpiVentas">$ 0</span></p>
            <p><strong>Total de Reservas: </strong><span id="kpiReservas">0</span></p>
        </div>

        <div class="card">
            <h3>Detalle de Reservas</h3>
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Fecha</th>
                        <th>Productor</th> <!-- NUEVA COLUMNA -->
                        <th>Producto</th>
                        <th>Cantidad</th>  <!-- NUEVA COLUMNA -->
                        <th>Total Pagado</th>
                    </tr>
                </thead>
                <tbody id="tablaReporte">
                </tbody>
            </table>
        </div>

        <button class="btn btn-success" onclick="descargarCSV()" style="width: 100%;">Exportar a Excel (CSV)</button>
    </div>
    <script src="../js/db.js"></script>
    <script src="../js/reporteController.js"></script>
</body>
</html>
